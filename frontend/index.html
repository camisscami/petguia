<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetGuia - Guia de Pets</title>
<style>
*{box-sizing:border-box;}
body{font-family:'Segoe UI', Arial, sans-serif; background:#FFF6EC; margin:0; padding:0; color:#3A2E2A;}
.topo{background:#FFE8D0; padding:28px 20px 22px 20px; text-align:center; border-bottom:3px solid #FFD9B3;}
.topo h1{color:#E67E22; font-size:36px; margin:0;}
.topo p{color:#8A7A72; font-size:17px; margin:8px 0 0 0;}
.container{max-width:900px; margin:0 auto; padding:22px 16px 60px 16px;}
.titulo-secao{font-size:24px; text-align:center; margin:10px 0 18px 0;}
.grade{display:flex; flex-wrap:wrap; gap:18px; justify-content:center;}
.card-animal{background:white; width:280px; border-radius:22px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,0.07); cursor:pointer; text-align:center; padding-bottom:16px;}
.card-animal img{width:100%; height:260px; object-fit:cover; display:block;}
.card-animal h3{margin:14px 0 4px 0; font-size:21px;}
.card-animal p{margin:0 14px; color:#8A7A72; font-size:14px; line-height:1.4;}
.btn-ver{background:#4CAF7D; color:white; border:none; padding:11px 18px; border-radius:20px; margin-top:12px; font-weight:700; cursor:pointer; font-size:15px;}
.btn-voltar{background:white; border:1px solid #E8D5C4; padding:10px 16px; border-radius:20px; cursor:pointer; margin-bottom:18px;}
.detalhe{background:white; border-radius:24px; padding:26px; box-shadow:0 8px 24px rgba(0,0,0,0.07); margin-top:30px;}
.detalhe img{width:100%; height:400px; object-fit:cover; border-radius:18px;}
.detalhe h2{font-size:30px; text-align:center; margin:16px 0 6px 0;}
.detalhe .sub{text-align:center; color:#8A7A72; margin:0 0 18px 0;}
.abas{text-align:center; margin:10px 0 18px 0;}
.abas button{padding:10px 18px; margin:4px; border:1px solid #E8D5C4; border-radius:20px; background:#FFFDFB; cursor:pointer; color:#7A6A62; font-size:15px;}
.abas button.ativo{background:#5D4A42; color:white;}
.verde{background:#EAF7EE; border-left:6px solid #4CAF7D; padding:14px; border-radius:12px; margin:12px 0; color:#2E5D43; line-height:1.6;}
.vermelho{background:#FDECEC; border-left:6px solid #E57373; padding:14px; border-radius:12px; margin:12px 0; color:#7A3A3A; line-height:1.6;}
.amarelo{background:#FFF8E1; border-left:6px solid #FFC107; padding:14px; border-radius:12px; margin:12px 0; color:#6D5A1A; line-height:1.6;}
.comentarios{margin-top:30px; background:#FFFDFB; border:1px solid #F0E2D5; border-radius:22px; padding:22px;}
.comentarios h3{margin-top:0;}
.comentario{display:flex; gap:12px; background:white; border-radius:16px; padding:12px; margin:12px 0; box-shadow:0 2px 8px rgba(0,0,0,0.04);}
.comentario img{width:70px; height:70px; object-fit:cover; border-radius:50%; flex-shrink:0;}
.comentario b{display:block; margin-bottom:4px;}
.comentario p{margin:0; color:#5D4A42; line-height:1.5;}
input, textarea{width:100%; padding:11px; border:1px solid #E8D5C4; border-radius:12px; margin:6px 0; font-family:inherit; font-size:15px;}
.btn-enviar{background:#4CAF7D; color:white; border:none; padding:12px; border-radius:14px; width:100%; font-weight:700; cursor:pointer; font-size:16px; margin-top:8px;}
.escondido{display:none;}
</style>
</head>
<body>
<div class="topo"><h1>🐾 PetGuia 🐾</h1><p>O guia fofinho para cuidar do seu melhor amigo!</p></div>
<div class="container" id="tela-lista">
<h2 class="titulo-secao">Escolha seu pet! Todos juntos aqui 💛</h2>
<div class="grade" id="grade"></div>
<div style="text-align:center; margin-top:26px;">
<img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=900" style="width:100%; max-width:800px; height:260px; object-fit:cover; border-radius:20px;">
<p style="color:#8A7A72;">🐶🐱🐹 Todos juntos e felizes!</p>
</div>
</div>
<div class="container escondido" id="tela-detalhe">
<button class="btn-voltar" onclick="voltar()">⬅ Voltar para todos os pets</button>
<div style="height:30px;"></div>
<div class="detalhe">
<img id="d-foto" src="" alt="pet">
<h2 id="d-nome"></h2>
<p class="sub" id="d-sub"></p>
<div class="abas">
<button onclick="mostrarAba(0)" id="aba-0" class="ativo">Alimentação</button>
<button onclick="mostrarAba(1)" id="aba-1">Habitat</button>
<button onclick="mostrarAba(2)" id="aba-2">Cuidados</button>
</div>
<h3 id="d-titulo"></h3>
<div id="d-texto"></div>
<div class="comentarios">
<h3>💬 Comentários de quem ama pets!</h3>
<p style="color:#8A7A72; margin-top:-6px;">Veja o que outras pessoas comentaram e deixe o seu também!</p>
<div id="lista-comentarios"></div>
<hr style="border:none; border-top:1px solid #F0E2D5; margin:18px 0;">
<h4>Deixe seu comentário 🍎</h4>
<input id="c-nome" placeholder="Seu nome - ex: Maria">
<textarea id="c-texto" rows="3" placeholder="Escreva aqui... Ex: Meu porquinho ama maçã! 🍎"></textarea>
<input id="c-foto" placeholder="Link da foto do seu pet (opcional) - cole o link aqui">
<button class="btn-enviar" onclick="enviarComentario()">Enviar Comentário 💛</button>
</div>
</div>
<div style="height:40px;"></div>
</div>
<script>
const animais = [
{ nome:"Porquinho-da-Índia", emoji:"🐹", sub:"Fofinho, comilão e ama vitamina C!", foto:"https://cobasiblog.blob.core.windows.net/production-ofc/2020/12/porquinho-da-india.png",
abas:[
{titulo:"Alimentação", texto:"<div class=verde><b>PODE:</b> Feno à vontade, pimentão, cenoura, couve, pepino, maçã</div><div class=vermelho><b>NAO PODE:</b> Alface americana, batata, chocolate, cebola</div><div class=amarelo><b>DICA:</b> Ele precisa de vitamina C todos os dias!</div>"},
{titulo:"Habitat", texto:"<div class=verde><b>IDEAL:</b> Gaiola grande, seca, sem vento, com toquinha</div><div class=vermelho><b>EVITE:</b> Serragem de pinus, gaiola pequena, sol direto</div>"},
{titulo:"Cuidados", texto:"<div class=verde><b>FACA:</b> Limpe a gaiola 2x por semana, escove os pelos</div><div class=vermelho><b>NAO FACA:</b> Dar banho toda semana, pegar pela barriga</div>"}
]},
{ nome:"Cachorro", emoji:"🐶", sub:"Leal, brincalhão e melhor amigo!", foto:"https://images.unsplash.com/photo-1552053831-71594a27632d?w=900",
abas:[
{titulo:"Alimentação", texto:"<div class=verde><b>PODE:</b> Ração, cenoura, maçã sem semente, frango cozido</div><div class=vermelho><b>NAO PODE:</b> Chocolate, uva, cebola, xilitol</div>"},
{titulo:"Habitat", texto:"<div class=verde><b>IDEAL:</b> Caminha macia, água fresca, espaço para correr</div><div class=vermelho><b>EVITE:</b> Deixar no sol, corrente curta</div>"},
{titulo:"Cuidados", texto:"<div class=verde><b>FACA:</b> Passear todo dia, vacinar, escovar os dentes</div><div class=vermelho><b>NAO FACA:</b> Bater, deixar sozinho o dia todo</div>"}
]},
{ nome:"Gato", emoji:"🐱", sub:"Independente, curioso e muito fofo!", foto:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=900",
abas:[
{titulo:"Alimentação", texto:"<div class=verde><b>PODE:</b> Ração de gato, frango cozido, abóbora</div><div class=vermelho><b>NAO PODE:</b> Leite, chocolate, cebola, alho</div>"},
{titulo:"Habitat", texto:"<div class=verde><b>IDEAL:</b> Caixa de areia limpa, arranhador, lugar alto</div><div class=vermelho><b>EVITE:</b> Barulho alto, mudar de lugar toda hora</div>"},
{titulo:"Cuidados", texto:"<div class=verde><b>FACA:</b> Escovar, brincar 15 min por dia, vacinar</div><div class=vermelho><b>NAO FACA:</b> Dar banho com força, cortar bigode</div>"}
]}
];
let comentarios = [
{nome:"Ana - Porquinho", texto:"Meu porquinho ama maçã! Dou um pedacinho todo dia e ele faz barulhinho de feliz!", foto:"https://cobasiblog.blob.core.windows.net/production-ofc/2020/12/porquinho-da-india.png"},
{nome:"Pedro - Cachorro", texto:"Meu cachorro aprendeu a sentar em 1 semana! Passeio todo dia ajuda muito!", foto:"https://images.unsplash.com/photo-1552053831-71594a27632d?w=200"},
{nome:"Julia - Gato", texto:"Minha gata ama dormir no alto! Coloquei uma prateleira só pra ela e ela amou!", foto:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200"}
];
let atual = 0;
function montarGrade(){
let g = document.getElementById("grade"); g.innerHTML = "";
animais.forEach((a,i)=>{ g.innerHTML += "<div class=card-animal onclick=abrirDetalhe("+i+")><img src="+a.foto+"><h3>"+a.emoji+" "+a.nome+"</h3><p>"+a.sub+"</p><button class=btn-ver>Ver Guia</button></div>"; });
}
function abrirDetalhe(i){
atual = i;
document.getElementById("tela-lista").classList.add("escondido");
document.getElementById("tela-detalhe").classList.remove("escondido");
document.getElementById("d-foto").src = animais[i].foto;
document.getElementById("d-nome").innerText = animais[i].emoji + " " + animais[i].nome;
document.getElementById("d-sub").innerText = animais[i].sub;
mostrarAba(0); mostrarComentarios();
window.scrollTo({top:0, behavior:"smooth"});
}
function voltar(){
document.getElementById("tela-detalhe").classList.add("escondido");
document.getElementById("tela-lista").classList.remove("escondido");
window.scrollTo({top:0, behavior:"smooth"});
}
function mostrarAba(a){
document.getElementById("d-titulo").innerText = animais[atual].abas[a].titulo;
document.getElementById("d-texto").innerHTML = animais[atual].abas[a].texto;
for(let j=0;j<3;j++) document.getElementById("aba-"+j).classList.remove("ativo");
document.getElementById("aba-"+a).classList.add("ativo");
}
function mostrarComentarios(){
let div = document.getElementById("lista-comentarios"); div.innerHTML = "";
comentarios.forEach(c=>{ div.innerHTML += "<div class=comentario><img src="+c.foto+"><div><b>"+c.nome+"</b><p>"+c.texto+"</p></div></div>"; });
}
function enviarComentario(){
let nome = document.getElementById("c-nome").value.trim();
let texto = document.getElementById("c-texto").value.trim();
let foto = document.getElementById("c-foto").value.trim();
if(nome==="" || texto===""){ alert("Escreva seu nome e seu comentário!"); return; }
if(foto==="") foto = animais[atual].foto;
comentarios.push({nome:nome, texto:texto, foto:foto});
document.getElementById("c-nome").value=""; document.getElementById("c-texto").value=""; document.getElementById("c-foto").value="";
mostrarComentarios(); alert("Comentário enviado! Obrigada!");
}
montarGrade();
</script>
</body>
</html>
